<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — ScaleTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card border-secondary shadow-lg my-4" style="width: 100%; max-width: 420px;">
        <div class="card-body p-5">

            <!-- Logo -->
            <div class="d-flex align-items-center gap-2 mb-4">
                <div class="rounded-3 p-2 bg-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 24 24">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </div>
                <span class="fw-bold fs-5 text-white">ScaleTech</span>
            </div>

            <!-- Heading -->
            <h1 class="h3 fw-bold text-white mb-1">Create an account</h1>
            <p class="text-secondary mb-4">Join ScaleTech and get started today</p>

            <!-- Messages -->
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger py-2 px-3 mb-3" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <!-- Form -->
            <form action="" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small text-uppercase fw-semibold">Username</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" name="username" placeholder="Choose a username" autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small text-uppercase fw-semibold">Email</label>
                    <input type="email" class="form-control bg-dark border-secondary text-white" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="mb-3">
                    <label for="password1" class="form-label text-secondary small text-uppercase fw-semibold">Password</label>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password1" name="password" placeholder="••••••••" autocomplete="new-password">
                </div>

                <div class="mb-4">
                    <label for="password2" class="form-label text-secondary small text-uppercase fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password2" name="retype_password" placeholder="••••••••" autocomplete="new-password">
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-semibold">
                    Create Account
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-secondary small mt-4 mb-0">
                Already have an account?
                <a href="{% url 'login_user' %}" class="text-primary-emphasis text-decoration-none fw-semibold">Sign In</a>
            </p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
