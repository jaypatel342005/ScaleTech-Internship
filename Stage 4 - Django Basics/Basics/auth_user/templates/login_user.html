<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — ScaleTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-dark min-vh-100 d-flex align-items-center justify-content-center"
  >
    <div
      class="card border-secondary shadow-lg"
      style="width: 100%; max-width: 420px"
    >
      <div class="card-body p-5">
        <!-- Logo -->
        <div class="d-flex align-items-center gap-2 mb-4">
          <div class="rounded-3 p-2 bg-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="white"
              viewBox="0 0 24 24"
            >
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
          </div>
          <span class="fw-bold fs-5 text-white">ScaleTech</span>
        </div>

        <!-- Heading -->
        <h1 class="h3 fw-bold text-white mb-1">Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to your account to continue</p>

        <!-- Error Messages -->
        {% if messages %} {% for message in messages %}
        <div class="alert alert-danger py-2 px-3 mb-3" role="alert">
          {{ message }}
        </div>
        {% endfor %} {% endif %}

        <!-- Form -->
        <form action="" method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label
              for="username"
              class="form-label text-secondary small text-uppercase fw-semibold"
              >Username</label
            >
            <input
              type="text"
              class="form-control bg-dark border-secondary text-white"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>

          <div class="mb-4">
            <label
              for="password"
              class="form-label text-secondary small text-uppercase fw-semibold"
              >Password</label
            >
            <input
              type="password"
              class="form-control bg-dark border-secondary text-white"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <button
            type="submit"
            id="login-btn"
            class="btn btn-primary w-100 py-2 fw-semibold"
          >
            Sign In
          </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-secondary small mt-4 mb-0">
          Don't have an account?
          <a
            href="{% url 'register_user' %}"
            class="text-primary-emphasis text-decoration-none fw-semibold"
            >Register</a
          >
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
