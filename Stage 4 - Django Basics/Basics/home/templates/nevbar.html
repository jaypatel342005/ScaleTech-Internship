{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <a class="nav-link active" href="/">Home</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" href="/about/">About</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" href="/members/">Members API</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" href="/todo/">Todos</a>
        </li>
    </ul>
    {% block content %}
    
    {% endblock %}
    <script>
        document.querySelectorAll('#myTab .nav-link').forEach(link => {
            if (link.getAttribute('href') === window.location.pathname) {
                document.querySelectorAll('#myTab .nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
